survos_tabler:
    # Without this block the bundle's own defaults render, which is why the navbar brand read
    # "myProject" (the default `abbr` is literally `my<b>Project</b>`) even though the page
    # <title> was already correct -- that comes from the template, not from here.
    app:
        code: rsun
        title: 'Richmond Sunlight'
        description: 'Virginia legislation, imported from Richmond Sunlight'
        # The <b> is the convention the default uses: the second half renders bold in the navbar.
        abbr: 'Richmond<b>Sunlight</b>'
        homepage_route: app_homepage
