ai:
    platform:
        gemini:
            api_key: '%env(GEMINI_API_KEY)%'
    agent:
        bill_chat:
            platform: 'ai.platform.gemini'
            model: 'gemini-flash-lite-latest'
            prompt:
                file: '%kernel.project_dir%/config/prompts/bill-chat.md'
            tools:
                - service: 'App\Chat\Tool\FindBills'
                  name: find_bills
                  description: Hybrid BM25 and semantic section search. Natural-language queries; grouped Code sections with short excerpts and separate bill/version citations. Pagination limit 1–50, offset 0–200 over a bounded candidate pool. Filters outcome, status, chamber, patron. Budget line items are not separately indexed. Read complete evidence with read_bill_section.
                - service: 'App\Chat\Tool\ReadBillSection'
                  name: read_bill_section
                  description: Read a complete bill section and its source version, status and inline changes.
                - service: 'App\Chat\Tool\ReadBill'
                  name: read_bill
                  description: Read the selected bill by numeric ID, with its summary, patron, full text, status and version references. Works for bills outside the 2026 section index.
                - service: 'App\Chat\Tool\FindBillSummaries'
                  name: find_bill_summaries
                  description: Title-weighted keyword search with vaping/e-cigarette and tobacco aliases; OR alternatives supported. Not embedding search; use find_bills for semantic retrieval. Pagination and outcome/status/chamber/patron filters supported. Budget line items are not separately indexed. Read cited evidence before answering.
            max_tool_calls: 8
