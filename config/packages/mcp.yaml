mcp:
    servers:
        bills:
            name: VA Bills
            description: Retrieve Virginia bill sections with version-specific citations.
            registry: 'App\Mcp\'
            transports:
                stdio: true
            http:
                path: /mcp
                allowed_hosts: ['localhost', '127.0.0.1', 'rsun.wip', 'vabills.org', 'rsun.survos.com']
